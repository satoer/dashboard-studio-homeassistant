send:
  name: Send data to topic
  description: Send a custom value or payload to any Dashboard Studio topic.
  fields:
    topic:
      name: Topic / Event Name
      description: Target topic path (e.g. custom/weather, homeassistant/message, or event name).
      required: true
      example: "custom/notification"
      selector:
        text:
    value:
      name: Value
      description: String, number, boolean, or JSON payload to publish to the topic.
      required: true
      example: "Front door opened"
      selector:
        text:
    retain:
      name: Retain in server cache
      description: Keep this topic value cached so newly connected dashboards receive it immediately.
      required: false
      default: true
      selector:
        boolean:

send_insights:
  name: Send Recorder / History data to chart
  description: Query Home Assistant history/statistics for an entity and publish it to a Dashboard Studio chart topic.
  fields:
    entity_id:
      name: Entity / Insight Source
      description: Home Assistant entity or sensor whose historical states should be queried.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        entity:
    timespan:
      name: Timespan / Time Range
      description: Time window to query from Home Assistant history.
      required: true
      default: "24h"
      selector:
        select:
          options:
            - label: "Today"
              value: "today"
            - label: "Yesterday"
              value: "yesterday"
            - label: "This Week"
              value: "this_week"
            - label: "Last 1 Hour"
              value: "1h"
            - label: "Last 6 Hours"
              value: "6h"
            - label: "Last 24 Hours"
              value: "24h"
            - label: "Last 7 Days"
              value: "7d"
            - label: "Last 30 Days"
              value: "30d"
            - label: "Last Year"
              value: "365d"
    datapoints:
      name: Resolution (Datapoints)
      description: Number of datapoints along the chart axis (2 to 500).
      required: false
      default: 20
      selector:
        number:
          min: 2
          max: 500
          mode: slider
          step: 1
    topic:
      name: Target Topic (Optional)
      description: Topic that the chart widget listens to. If omitted, the entity ID is used.
      required: false
      example: "insights/living_room_temp"
      selector:
        text:

send_insights_advanced:
  name: Send Recorder / History data to chart (Advanced)
  description: Query Home Assistant history with custom aggregation, resolution, and time buckets, publish to a chart topic, and return summary statistics.
  supports_response: "optional"
  fields:
    entity_id:
      name: Entity / Insight Source
      description: Home Assistant entity or sensor whose historical states should be queried.
      required: true
      example: "sensor.power_consumption"
      selector:
        entity:
    timespan:
      name: Timespan / Time Range
      description: Time window to query from Home Assistant history.
      required: true
      default: "24h"
      selector:
        select:
          options:
            - label: "Today"
              value: "today"
            - label: "Yesterday"
              value: "yesterday"
            - label: "This Week"
              value: "this_week"
            - label: "Last 1 Hour"
              value: "1h"
            - label: "Last 6 Hours"
              value: "6h"
            - label: "Last 24 Hours"
              value: "24h"
            - label: "Last 7 Days"
              value: "7d"
            - label: "Last 14 Days"
              value: "14d"
            - label: "Last 30 Days"
              value: "30d"
            - label: "Last Year"
              value: "365d"
    datapoints:
      name: Resolution (Datapoints)
      description: Number of datapoints along the chart axis (2 to 500).
      required: false
      default: 20
      selector:
        number:
          min: 2
          max: 500
          mode: slider
          step: 1
    resolution:
      name: Resolution / Bucket Size
      description: Optional bucket size (auto, 5m, 15m, 1h, 6h, 1d).
      required: false
      default: "auto"
      selector:
        select:
          options:
            - label: "Automatic"
              value: "auto"
            - label: "5 Minutes"
              value: "5m"
            - label: "15 Minutes"
              value: "15m"
            - label: "1 Hour"
              value: "1h"
            - label: "6 Hours"
              value: "6h"
            - label: "1 Day"
              value: "1d"
    aggregation:
      name: Aggregation Method
      description: How values inside each time bucket should be combined.
      required: false
      default: "mean"
      selector:
        select:
          options:
            - label: "Mean (Average)"
              value: "mean"
            - label: "Min"
              value: "min"
            - label: "Max"
              value: "max"
            - label: "Sum"
              value: "sum"
            - label: "Delta (Last minus First)"
              value: "delta"
            - label: "Last"
              value: "last"
            - label: "First"
              value: "first"
            - label: "Median"
              value: "median"
    topic:
      name: Target Topic (Optional)
      description: Topic that the chart widget listens to. If omitted, the entity ID is used.
      required: false
      example: "insights/power_24h"
      selector:
        text:

reload:
  name: Reload or switch dashboard
  description: Force all connected Dashboard Studio viewers to reload or switch to a specific dashboard file.
  fields:
    dashboard:
      name: Dashboard Name / Filename (Optional)
      description: Leave empty to reload the current dashboard, or specify a dashboard name (e.g. default or wall_tablet.json) to switch.
      required: false
      example: "default"
      selector:
        text:

load_filter_ical:
  name: Load and filter iCal / WebCal URL
  description: Fetch an iCal/WebCal calendar feed, expand recurring occurrences, filter events by timeframe, and return a filtered events JSON envelope.
  fields:
    url:
      name: Calendar URL
      description: HTTP/HTTPS or webcal:// URL of the .ics feed.
      required: true
      example: "https://calendar.google.com/calendar/ical/example/basic.ics"
      selector:
        text:
    target_mode:
      name: Timeframe
      description: Preset timeframe or custom range to filter events into.
      required: false
      default: "previous_current_next_month"
      selector:
        select:
          options:
            - label: "Previous, Current and Next Month (Recommended)"
              value: "previous_current_next_month"
            - label: "Today (+7 days)"
              value: "today"
            - label: "Yesterday (+7 days)"
              value: "yesterday"
            - label: "Tomorrow (+7 days)"
              value: "tomorrow"
            - label: "Day after Tomorrow"
              value: "day_after_tomorrow"
            - label: "Start of this Week"
              value: "start_this_week"
            - label: "Start of previous Week"
              value: "start_previous_week"
            - label: "Start of next Week"
              value: "start_next_week"
            - label: "Start of this Month"
              value: "start_this_month"
            - label: "Start of previous Month"
              value: "start_previous_month"
            - label: "Start of next Month"
              value: "start_next_month"
            - label: "Custom Range"
              value: "custom"
    custom_start:
      name: Custom Start Date (Optional)
      description: Start date when using Custom Range (e.g. 23-12-2026 or 23/12).
      required: false
      selector:
        text:
    custom_end:
      name: Custom End Date (Optional)
      description: End date when using Custom Range (e.g. 31-12-2026 or 31/12).
      required: false
      selector:
        text:
    max_events:
      name: Max Events (Optional)
      description: Maximum number of events to keep (0 = unlimited).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 500
          mode: box
    topic:
      name: Target Topic (Optional)
      description: Optional topic to publish the filtered events JSON to.
      required: false
      selector:
        text:

webcal_to_markdown:
  name: Convert iCal JSON to Markdown
  description: Convert filtered or combined iCal JSON tokens into rich formatted Markdown tables or calendar grids with blocks and icons.
  fields:
    droptoken:
      name: Calendar Token or URL (droptoken)
      description: Filtered or combined events JSON token from Load & Filter iCal, or raw calendar URL.
      required: true
      selector:
        text:
          multiline: true
    format:
      name: View Format
      description: Display layout for the generated calendar Markdown.
      required: false
      default: "day_view"
      selector:
        select:
          options:
            - label: "Day View"
              value: "day_view"
            - label: "Tomorrow (Day View)"
              value: "tomorrow_day_view"
            - label: "Yesterday (Day View)"
              value: "yesterday_day_view"
            - label: "Today & Tomorrow List"
              value: "today_tomorrow_list"
            - label: "Week View"
              value: "week_view"
            - label: "Next Week View"
              value: "next_week_view"
            - label: "Previous Week View"
              value: "previous_week_view"
            - label: "Workweek View (Mon-Fri)"
              value: "workweek_view"
            - label: "Next Workweek View"
              value: "next_workweek_view"
            - label: "Previous Workweek View"
              value: "previous_workweek_view"
            - label: "Weekend View (Sat-Sun)"
              value: "weekend_view"
            - label: "Next Weekend View"
              value: "next_weekend_view"
            - label: "Month View"
              value: "month_view"
            - label: "Next Month View"
              value: "next_month_view"
            - label: "Previous Month View"
              value: "previous_month_view"
            - label: "Month Workweek View"
              value: "month_workweek_view"
            - label: "Next Month Workweek View"
              value: "next_month_workweek_view"
            - label: "Month Weekend View"
              value: "month_weekend_view"
            - label: "Next Month Weekend View"
              value: "next_month_weekend_view"
            - label: "Days from Date (1 Day)"
              value: "days_from_date_1"
            - label: "Days from Date (2 Days)"
              value: "days_from_date_2"
            - label: "Days from Date (3 Days)"
              value: "days_from_date_3"
            - label: "Days from Date (4 Days)"
              value: "days_from_date_4"
            - label: "Days from Date (5 Days)"
              value: "days_from_date_5"
            - label: "Days from Date (6 Days)"
              value: "days_from_date_6"
            - label: "Days from Date (7 Days)"
              value: "days_from_date_7"
    topic:
      name: Target Topic (Optional)
      description: Optional topic to publish the generated Markdown to.
      required: false
      example: "calendar/family_markdown"
      selector:
        text:
    url_1:
      name: Legacy Source 1 (Optional fallback)
      description: Fallback calendar URL if droptoken is omitted.
      required: false
      selector:
        text:

