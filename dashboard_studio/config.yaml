name: "Dashboard Studio"
version: "2.3.2"
slug: "dashboard_studio"
description: "Visual WYSIWYG Dashboard Designer and Runtime Server for Home Assistant"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 5050
panel_icon: "mdi:view-dashboard"
panel_title: "Dashboard Studio"
homeassistant_api: true
hassio_api: true
host_network: false
ports:
  5050/tcp: 5050
ports_description:
  5050/tcp: "Dashboard Studio Direct Web UI, Editor & Wall-Tablet Viewer Port"
map:
  - homeassistant_config:rw
  - share:rw
  - media:ro
options:
  port: 5050
  ha_url: ""
  ha_token: ""
schema:
  port: port
  ha_url: "str?"
  ha_token: "password?"
