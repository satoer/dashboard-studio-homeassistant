<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard Studio">

    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <title>Dashboard Studio</title>
    <script>
        (function () {
            try {
                var type = '';
                if (typeof performance !== 'undefined' && performance.getEntriesByType) {
                    var nav = performance.getEntriesByType('navigation')[0];
                    if (nav) type = nav.type;
                }
                if (!type && typeof performance !== 'undefined' && performance.navigation && performance.navigation.type === 2) {
                    type = 'back_forward';
                }
                if (type === 'back_forward') window.location.reload();
            } catch (e) { }
        })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #94a3b8;
        }
    </style>
    <script src="entry-router.js"></script>
</head>

</body>

</html>
